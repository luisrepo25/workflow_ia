version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout

      - setup_remote_docker:
          version: default

      # ── Instalar dependencias ──
      - run:
          name: Instalar dependencias Python
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

      # ── Build de la imagen Docker ──
      - run:
          name: Build Docker image
          command: docker build -t workflow_ia:latest .

      # ── Tests con Django (check + migrate seco) ──
      - run:
          name: Django system checks & migrate dry-run
          command: |
            . venv/bin/activate
            python manage.py check
            python manage.py migrate --run-syncdb --check

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout

      # ── Agregar la clave SSH del EC2 al known_hosts ──
      - add_ssh_keys:
          fingerprints:
            - "SHA256:cJ1W+1/OBU6rnqDS0vp3SCQz2Z1APBroMXuEFRCNlCk"

      - run:
          name: Agregar EC2 a known_hosts
          command: ssh-keyscan -H $EC2_IP >> ~/.ssh/known_hosts

      # ── Deploy: pull + docker compose up en EC2 ──
      - run:
          name: Deploy a EC2
          no_output_timeout: 15m
          command: |
            ssh ${EC2_USER}@${EC2_IP} bash -c "'
              cd ${EC2_PATH} &&
              git pull origin main &&
              docker system prune -af --volumes &&
              docker compose down &&
              docker compose up -d --build
            '"

workflows:
  build-test-deploy:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build-and-test
          filters:
            branches:
              only: main