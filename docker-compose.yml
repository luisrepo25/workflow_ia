
services:
  web:
    build:
      context: .
      target: runtime
    # ── Imagen en registry (Docker Hub / ECR) ──
    #    En CI/CD se pushea aquí; en EC2 se hace pull.
    #    Localmente se ignora (usa build local).
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_USER:-workflow_ia}/workflow_ia:${IMAGE_TAG:-latest}"
    container_name: workflow_ia_web
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"